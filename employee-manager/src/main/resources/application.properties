spring.application.name=employee-manager

#---- XAMPP MySQL connection (Port 3307) ----
spring.datasource.url=jdbc:mysql://localhost:3307/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
