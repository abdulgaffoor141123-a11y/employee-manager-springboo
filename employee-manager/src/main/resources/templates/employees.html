<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="mb-4">Employee Management System</h2>

    <!-- Employee Form -->
    <div class="card p-4 mb-5 shadow-sm">
        <h4>Add New Employee</h4>
        <form th:action="@{/employees}" th:object="${employee}" method="post">
            
            <div class="mb-3">
                <label class="form-label">Full Name:</label>
                <input type="text" th:field="*{fullName}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="text" th:field="*{email}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone:</label>
                <input type="text" th:field="*{phone}" class="form-control" placeholder="10 digits" />
                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Department:</label>
                <input type="text" th:field="*{department}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Salary:</label>
                <input type="number" step="0.01" th:field="*{salary}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Save Employee</button>
        </form>
    </div>

    <!-- Employee Table -->
    <h4>Employee List</h4>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}">1</td>
                <td th:text="${emp.fullName}">John Doe</td>
                <td th:text="${emp.email}">john@example.com</td>
                <td th:text="${emp.phone}">0711234567</td>
                <td th:text="${emp.department}">IT</td>
                <td th:text="${emp.salary}">50000.0</td>
                <td>
                    <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-warning btn-sm">Edit</a>
                    
                    <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this employee?')">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="7" class="text-center">No employees found.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
